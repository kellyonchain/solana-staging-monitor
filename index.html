<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Staging Monitor</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #888;
      margin-bottom: 30px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #2a2a2a;
      font-size: 0.9rem;
    }
    th {
      background: #222;
      color: #aaa;
      font-weight: 500;
    }
    tr:hover {
      background: #222;
    }
    .signature {
      font-family: monospace;
      font-size: 0.8rem;
      color: #7cb3ff;
    }
    .badge {
      background: #2a2a2a;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    footer {
      margin-top: 40px;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Solana Staging Monitor</h1>
    <p class="subtitle">Early-warning signals • Durable nonce & system activity</p>

    <table>
      <thead>
        <tr>
          <th>Time (UTC)</th>
          <th>Signature</th>
          <th>Slot</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="events-body">
        <tr>
          <td colspan="4">Loading data...</td>
        </tr>
      </tbody>
    </table>

    <footer>
      Data is collected automatically from Solana. This is an early monitoring tool.
    </footer>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('data/events.csv');
        const text = await response.text();
        const lines = text.trim().split('\n');
        const rows = lines.slice(1).reverse(); // newest first

        const tbody = document.getElementById('events-body');
        tbody.innerHTML = '';

        rows.slice(0, 30).forEach(line => {
          const cols = line.split(',');
          if (cols.length < 5) return;

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${cols[0].replace('T', ' ').slice(0, 19)}</td>
            <td class="signature">${cols[1].slice(0, 20)}...</td>
            <td>${cols[3]}</td>
            <td><span class="badge">${cols[5] || cols[4]}</span></td>
          `;
          tbody.appendChild(tr);
        });

        if (rows.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4">No data yet</td></tr>';
        }
      } catch (err) {
        document.getElementById('events-body').innerHTML = 
          '<tr><td colspan="4">Failed to load data</td></tr>';
      }
    }

    loadData();
  </script>
</body>
</html>
