<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Staging Monitor</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #111827;
      --border: #1f2937;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --green: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 40px 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 40px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 1.05rem;
    }

    .badge {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-top: 12px;
      font-weight: 500;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 16px 20px;
      background: #0f172a;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .signature {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      color: #93c5fd;
    }

    .note {
      display: inline-block;
      background: #1e293b;
      color: #94a3b8;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
    }

    footer {
      margin-top: 30px;
      color: var(--muted);
      font-size: 0.85rem;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px 12px;
      }
      th, td {
        padding: 12px;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Solana Staging Monitor</h1>
      <p class="subtitle">Early-warning signals for attack staging patterns on Solana</p>
      <div class="badge">Live • Auto-updating</div>
    </header>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Time (UTC)</th>
            <th>Signature</th>
            <th>Slot</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="events-body">
          <tr>
            <td colspan="4" style="text-align:center; padding: 40px; color: #6b7280;">
              Loading latest events...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer>
      Data is collected automatically every few hours from Solana mainnet.<br>
      This is an early-stage monitoring tool focused on staging signals.
    </footer>
  </div>

  <script>
    async function loadData() {
      try {
        const response = await fetch('data/events.csv?t=' + Date.now());
        const text = await response.text();
        const lines = text.trim().split('\n');
        const rows = lines.slice(1).reverse(); // newest first

        const tbody = document.getElementById('events-body');
        tbody.innerHTML = '';

        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:#6b7280;">No data yet</td></tr>`;
          return;
        }

        rows.slice(0, 40).forEach(line => {
          const cols = line.split(',');
          if (cols.length < 5) return;

          const time = cols[0].replace('T', ' ').slice(0, 19);
          const signature = cols[1];
          const slot = cols[3] || '-';
          const note = cols[5] || cols[4] || 'activity';

          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${time}</td>
            <td class="signature" title="${signature}">${signature.slice(0, 28)}...</td>
            <td>${slot}</td>
            <td><span class="note">${note}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('events-body').innerHTML = `
          <tr><td colspan="4" style="text-align:center;padding:40px;color:#ef4444;">
            Failed to load data
          </td></tr>`;
      }
    }

    loadData();
    // Auto refresh every 5 minutes
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>
